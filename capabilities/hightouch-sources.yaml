naftiko: 1.0.0-alpha2
info:
  label: Hightouch Management API — Sources
  description: 'Hightouch Management API — Sources. 3 operations. Lead operation: List sources. Self-contained Naftiko capability
    covering one Hightouch business surface.'
  tags:
  - Hightouch
  - Sources
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HIGHTOUCH_API_KEY: HIGHTOUCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: hightouch-sources
    baseUri: https://api.hightouch.com
    description: Hightouch Management API — Sources business capability. Self-contained, no shared references.
    resources:
    - name: api-v1-sources
      path: /api/v1/sources
      operations:
      - name: listsources
        method: GET
        description: List sources
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createsource
        method: POST
        description: Create a source
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v1-sources-id
      path: /api/v1/sources/{id}
      operations:
      - name: getsource
        method: GET
        description: Get a source
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.HIGHTOUCH_API_KEY}}'
  exposes:
  - type: rest
    namespace: hightouch-sources-rest
    port: 8080
    description: REST adapter for Hightouch Management API — Sources. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v1/sources
      name: api-v1-sources
      description: REST surface for api-v1-sources.
      operations:
      - method: GET
        name: listsources
        description: List sources
        call: hightouch-sources.listsources
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createsource
        description: Create a source
        call: hightouch-sources.createsource
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/sources/{id}
      name: api-v1-sources-id
      description: REST surface for api-v1-sources-id.
      operations:
      - method: GET
        name: getsource
        description: Get a source
        call: hightouch-sources.getsource
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: hightouch-sources-mcp
    port: 9090
    transport: http
    description: MCP adapter for Hightouch Management API — Sources. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-sources
      description: List sources
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: hightouch-sources.listsources
      outputParameters:
      - type: object
        mapping: $.
    - name: create-source
      description: Create a source
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: hightouch-sources.createsource
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-source
      description: Get a source
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: hightouch-sources.getsource
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
