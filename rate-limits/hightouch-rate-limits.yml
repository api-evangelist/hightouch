provider: Hightouch
providerId: hightouch
limit_count: 1
limits:
- name: Hightouch REST API
  scope: workspace
  limit: 200
  window: 10 seconds
  metric: requests
  burst: null
  applies: https://api.hightouch.com/api/v1 (all operations)
  source: https://hightouch.com/docs/developer-tools/api-guide#hightouch-api-rate-limits
  quote: The Hightouch API rate limit is 200 requests per 10 seconds per workspace.
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  note: No RateLimit-* / X-RateLimit-* / Retry-After headers were present on live responses from https://api.hightouch.com/api/v1/syncs
    probed on 2026-08-13 (response headers were only x-powered-by and strict-transport-security). Hightouch
    publishes the number but emits no runtime signal, so an agent cannot see how much quota is left —
    it can only back off after a failure.
response_codes:
  throttled: 429
throttle_response:
  status: 429
  schema: TriggerErrorResponse
  body: '{ "error": "..." }'
  note: 429 with the TriggerErrorResponse envelope is declared on the trigger operations (TriggerRun,
    TriggerRunCustom, TriggerCampaign, TriggerSequenceRun, RunFlow) in the OpenAPI.
destination_rate_limits:
  note: Separate from the API limit, Hightouch surfaces DESTINATION_RATE_LIMIT as a sync error when a
    downstream tool throttles a sync, and the HTTP Request destination lets you configure outbound rate
    limiting and concurrency.
  docs:
  - https://hightouch.com/docs/developer-tools/error-codes
  - https://hightouch.com/docs/destinations/http-request#configure-rate-limiting-and-concurrency
