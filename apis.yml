aid: hightouch
name: Hightouch
description: Hightouch is a composable Customer Data Platform (CDP) and data activation platform that syncs data from warehouses
  such as Snowflake and BigQuery to more than 300 SaaS destinations including Salesforce, HubSpot, Google Ads, and Facebook
  Ads. The platform supports reverse ETL, audience segmentation, journey orchestration, real-time personalization, AI Decisioning,
  and an Ad Studio for advertising campaigns. A Resource API provides programmatic management of the platform with git version
  control and approval workflows.
