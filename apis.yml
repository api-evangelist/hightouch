aid: hightouch
name: Hightouch
description: Hightouch is a composable Customer Data Platform (CDP) and agentic marketing platform that
  activates data directly from cloud warehouses and lakehouses such as Snowflake, BigQuery, Databricks
  and Redshift to more than 290 SaaS destinations, without copying or storing customer data. The platform
  covers Reverse ETL, Customer Studio audience building and journey orchestration, identity resolution,
  first-party event collection with SDKs for web and mobile, real-time personalization, AI Decisioning,
  Match Booster and an Ad Studio for advertising creative. Developers get a bearer-authenticated REST
  API at https://api.hightouch.com/api/v1 covering sources, models, destinations, syncs and runs, campaigns,
  decision-engine flows, event contracts and identity graphs, plus an `ht` CLI, Git Sync for version-controlled
  resource YAML, workspace environments with approval flows, a public documentation MCP server, and an
  A2A agent card for the Hightouch Marketing Agent.
