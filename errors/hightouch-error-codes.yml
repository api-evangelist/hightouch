generated: '2026-08-13'
method: searched
source: https://hightouch.com/docs/developer-tools/error-codes
note: Hightouch's platform error-code registry. These are operational sync/destination error codes surfaced
  on sync runs and in the UI, not HTTP status codes — the HTTP-level error envelopes for the REST API
  are in errors/hightouch-problem-types.yml. Third-party API errors are passed through verbatim and are
  explicitly out of scope of this registry per the provider.
categories:
- Destination errors
- Predictive traits errors
- Rejected-row errors
- Sync request errors
error_count: 101
errors:
- code: DUPLICATE_COLUMNS_DETECTED
  category: Sync request errors
  destination: null
  meaning: Your model query returns duplicate column names.
  action: Alias columns in your model SQL so every selected field has a unique name.
- code: NON_UNIQUE_PRIMARY_KEY
  category: Sync request errors
  destination: null
  meaning: The selected primary key contains duplicate values.
  action: Update your model so each row has a unique identifier. If you're using a SQL model, add a `DISTINCT`
    clause or `GROUP BY` on the key column.
- code: UNSUPPORTED_PRIMARY_KEY_TYPE
  category: Sync request errors
  destination: null
  meaning: The primary key's data type isn't supported for this sync path.
  action: Cast the primary key to a supported type (typically `VARCHAR` or `INTEGER`) in your model SQL.
- code: QUERY_COLUMN_MISSING
  category: Sync request errors
  destination: null
  meaning: A column referenced in your sync configuration no longer exists in the model query results.
  action: Refresh the model schema in Hightouch and update your field mappings to use valid columns.
- code: WAREHOUSE_TABLE_MISSING
  category: Sync request errors
  destination: null
  meaning: A warehouse table required for sync planning doesn't exist.
  action: Confirm the table still exists in your warehouse and that the model points to the correct schema
    and table name.
- code: PREVIOUS_SYNC_RUN_OBJECT_MISSING
  category: Sync request errors
  destination: null
  meaning: Stored objects from the previous sync run are missing, usually because cached plan data expired.
  action: Retry the sync. If it persists, trigger a full resync to rebuild sync state.
- code: REMOVE_PLAN_INCOMPLETE
  category: Sync request errors
  destination: null
  meaning: Backfill or removal planning couldn't complete during a planner transition.
  action: Retry the sync after a few minutes. If it continues, contact support.
- code: REMOVE_RETRY_CHANGED_COLUMN_TYPES
  category: Sync request errors
  destination: null
  meaning: Rejected-row removal retries are unsafe because model column types changed between runs.
  action: Refresh your model schema and trigger a full resync from a consistent state.
- code: SORT_RAN_OUT_OF_DISK_SPACE
  category: Sync request errors
  destination: null
  meaning: Sorting rows exhausted available disk space.
  action: Narrow the model to reduce row volume, or contact support for infrastructure help.
- code: UNSPECIFIED
  category: Sync request errors
  destination: null
  meaning: Hightouch couldn't classify the failure into a more specific code.
  action: Use the live debugger and warehouse sync logs to identify the root cause.
- code: DESTINATION_INVALID_GRANT
  category: Destination errors
  destination: null
  meaning: The destination's authorization grant expired or was revoked.
  action: Reconnect the destination in Hightouch to refresh authorization.
- code: DESTINATION_INVALID_CREDENTIALS
  category: Destination errors
  destination: null
  meaning: The destination credentials are invalid.
  action: Verify the username, password, token, or secret configured for the destination. Reconnect if
    needed.
- code: DESTINATION_INVALID_API_KEY
  category: Destination errors
  destination: null
  meaning: The API key is invalid or expired.
  action: Replace it with a current key that has the required permissions.
- code: DESTINATION_DEFINITION_NOT_FOUND
  category: Destination errors
  destination: null
  meaning: Hightouch couldn't load the destination type definition.
  action: Confirm you're using a supported destination type. If the connector appears broken, contact
    support.
- code: DESTINATION_INTERNAL_ERROR
  category: Destination errors
  destination: null
  meaning: The destination returned a generic internal failure or timed out.
  action: Retry the sync. If it continues, check the destination's status page for outages, or contact
    support.
- code: DESTINATION_RATE_LIMIT
  category: Destination errors
  destination: null
  meaning: The destination rate-limited the sync.
  action: Wait for the rate limit window to reset, then retry. To prevent recurrence, reduce sync frequency
