- code: DESTINATION_PAYLOAD_TOO_LARGE
  category: Destination errors
  destination: null
  meaning: The destination rejected the payload as too large.
  action: Reduce batch size in your sync configuration, or trim the number of mapped fields.
- code: SALESFORCE_INACTIVE_USER
