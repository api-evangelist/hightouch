openapi: 3.2.0
info:
  title: Hightouch Models API
  version: 1.0.0
  description: Hightouch Public Rest API to access syncs, models, sources and destinations
  contact:
    name: Hightouch
    url: https://hightouch.com
servers:
- url: https://api.hightouch.com/api/v1
tags:
- name: Models
paths:
  /models/{modelId}/size:
    post:
      operationId: StartAudienceSizeJob
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/StartAudienceSizeJobOutput'
                - $ref: '#/components/schemas/ValidateErrorJSON'
                - $ref: '#/components/schemas/InternalServerError'
              examples:
                Example 1:
                  value:
                    jobId: 7e54c0ff-1710-454f-a25b-d44f8319fc3e
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Validation Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: Start a background job to compute audience size.
      summary: Start an audience size job
      security:
      - bearerAuth: []
      parameters:
      - description: The id of the audience
        in: path
        name: modelId
        required: true
        schema:
          format: double
          type: number
      tags:
      - Models
  /models/{modelId}/size/{jobId}:
    get:
      operationId: GetAudienceSize
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AudienceSizeJob'
                - $ref: '#/components/schemas/ValidateErrorJSON'
                - $ref: '#/components/schemas/InternalServerError'
              examples:
                pending:
                  value:
                    jobId: 7e54c0ff-1710-454f-a25b-d44f8319fc3e
                    status: pending
                    size: null
                    evaluatedAt: null
                    error: null
                success:
                  value:
                    jobId: 7e54c0ff-1710-454f-a25b-d44f8319fc3e
                    status: success
                    size: 141421
                    evaluatedAt: '2026-09-09T12:00:00.000Z'
                    error: null
                failed:
                  value:
                    jobId: 7e54c0ff-1710-454f-a25b-d44f8319fc3e
                    status: failed
                    size: null
                    evaluatedAt: null
                    error: relation "analytics.users" does not exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Validation Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: Get the state of an audience size job.
      summary: Get an audience size
      security:
      - bearerAuth: []
      parameters:
      - description: The id of the audience
        in: path
        name: modelId
        required: true
        schema:
          format: double
          type: number
      - description: The id returned when the size job was started
        in: path
        name: jobId
        required: true
        schema:
          type: string
      tags:
      - Models
  /models/{modelId}/match-booster/trigger:
    post:
      operationId: TriggerEnrichment
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/MatchBoosterTriggerOutput'
                - $ref: '#/components/schemas/ValidateErrorJSON'
                - $ref: '#/components/schemas/InternalServerError'
              examples:
                Example 1:
                  value:
                    id: '42'
                    status: processing
                    createdAt: '2026-08-19T00:00:00.000Z'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Validation Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: 'Trigger a Match Booster enrichment run for a model. The model must have

        Match Booster enabled.'
      summary: Trigger Match Booster enrichment
      security:
      - bearerAuth: []
      parameters:
      - description: The id of the model to enrich
        in: path
        name: modelId
        required: true
        schema:
          format: double
          type: number
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchBoosterTriggerInput'
            example:
              forceFullEnrichment: false
      tags:
      - Models
  /models/{modelId}/match-booster/runs:
    get:
      operationId: ListEnrichmentRuns
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ListMatchBoosterRunsOutput'
                - $ref: '#/components/schemas/ValidateErrorJSON'
                - $ref: '#/components/schemas/InternalServerError'
              examples:
                Example 1:
                  value:
                    data:
                    - id: 715eba82-2097-4c1b-91c0-ae7c279c763a
                      status: success
                      region: us
                      error: null
                      enrichedRows: 100000
                      isFullEnrichment: false
                      durationMs: 360000
                      enrichedAt: '2026-08-19T00:00:00.000Z'
                    hasMore: false
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Validation Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: List Match Booster enrichment runs for a model, most recent first.
      summary: List Match Booster enrichment runs
      security:
      - bearerAuth: []
      parameters:
      - description: The id of the model
        in: path
        name: modelId
        required: true
        schema:
          format: double
          type: number
      - description: Filter runs to a Match Booster region
        in: query
        name: region
        required: false
        schema:
          type: string
          enum:
          - us
          - eu
      - description: limit the number of objects returned (default is 100)
        in: query
        name: limit
        required: false
        schema:
          default: 100
          format: double
          type: number
      - description: set the offset on results (for pagination)
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: double
          type: number
      tags:
      - Models
  /models/{modelId}:
    get:
      operationId: GetModel
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
              examples:
                Example 1:
                  value:
                    id: 1
                    name: testModel
                    slug: testModel
                    description: ''
                    workspaceId: 1
                    primaryKey: id
                    createdAt: '2022-02-16T21:37:58.510Z'
                    updatedAt: '2022-02-16T21:37:58.510Z'
                    createdBy:
                      id: 1
                      name: Jane Doe
                      email: jane.doe@example.com
                    updatedBy:
                      id: 1
                      name: Jane Doe
                      email: jane.doe@example.com
                    sourceId: 1
                    queryType: raw_sql
                    tags:
                      foo: bar
                    isSchema: false
                    isGeneralModel: false
                    raw:
                      sql: select * from users
                    syncs:
                    - 1
                    - 2
                    lastRunSize: 12345
        '401':
          description: Unauthorized
        '404':
          description: Not found
      description: Retrieve models from model ID
      summary: Get Model
      security:
      - bearerAuth: []
      parameters:
      - description: The id of the model
        in: path
        name: modelId
        required: true
        schema:
          format: double
          type: number
      tags:
      - Models
    patch:
      operationId: UpdateModel
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Model'
                - $ref: '#/components/schemas/ValidateErrorJSON'
                - $ref: '#/components/schemas/InternalServerError'
              examples:
                Example 1:
                  value:
                    id: 1
                    name: testModel
                    slug: testModel
                    description: Names of all users
                    workspaceId: 1
                    primaryKey: id
                    createdAt: '2022-02-16T21:37:58.510Z'
                    updatedAt: '2022-02-17T23:19:05.000Z'
                    createdBy:
                      id: 1
                      name: Jane Doe
                      email: jane.doe@example.com
                    updatedBy:
                      id: 1
                      name: Jane Doe
                      email: jane.doe@example.com
                    sourceId: 1
                    queryType: raw_sql
                    tags:
                      foo: bar
                    isSchema: false
                    isGeneralModel: false
                    raw:
                      sql: select name from users
                    syncs:
                    - 1
                    - 2
                    lastRunSize: 12345
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '422':
          description: Validation Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: 'Update an existing model


        Patch a model based on its Hightouch ID'
      summary: Update Model
      security:
      - bearerAuth: []
      parameters:
      - description: The model's ID
        in: path
        name: modelId
        required: true
        schema:
          format: double
          type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelUpdate'
            example:
              name: testmodel
              description: Names of all users
              primaryKey: id
              raw:
                sql: select name from users
      tags:
      - Models
    delete:
      operationId: DeleteModel
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                anyOf:
                - {}
                - $ref: '#/components/schemas/ValidateErrorJSON'
                - $ref: '#/components/schemas/InternalServerError'
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '422':
          description: Validation Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: 'Delete a model


        Deletes a model based on its Hightouch ID. Any syncs that use the model are

        deleted as well. Deleting a parent model also deletes every audience built

        on it. A model that is still referenced by a journey, priority list,

        decision engine agent, dynamic content condition, saved chart, or identity

        resolution graph cannot be deleted until those references are removed.'
      summary: Delete Model
      security:
      - bearerAuth: []
      parameters:
      - description: The model's ID
        in: path
        name: modelId
        required: true
        schema:
          format: double
          type: number
      tags:
      - Models
  /models:
    get:
      operationId: ListModel
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/Model'
                    type: array
                required:
                - data
                type: object
              examples:
                Example 1:
                  value:
                    data:
                    - id: 1
                      name: testModel
                      slug: testModel
                      description: ''
                      workspaceId: 1
                      primaryKey: id
                      createdAt: '2022-02-16T21:37:58.510Z'
                      updatedAt: '2022-02-16T21:37:58.510Z'
                      createdBy:
                        id: 1
                        name: Jane Doe
                        email: jane.doe@example.com
                      updatedBy:
                        id: 1
                        name: Jane Doe
                        email: jane.doe@example.com
                      sourceId: 1
                      queryType: raw_sql
                      tags:
                        foo: bar
                      isSchema: false
                      isGeneralModel: false
                      raw:
                        sql: select * from users
                      syncs:
                      - 1
                      - 2
                      lastRunSize: 12345
                    - id: 2
                      name: testModel2
                      slug: testModel2
                      description: ''
                      workspaceId: 1
                      primaryKey: id
                      createdAt: '2022-02-16T21:37:58.510Z'
                      updatedAt: '2022-02-16T21:37:58.510Z'
                      createdBy:
                        id: 1
                        name: Jane Doe
                        email: jane.doe@example.com
                      updatedBy:
                        id: 1
                        name: Jane Doe
                        email: jane.doe@example.com
                      sourceId: 1
                      queryType: raw_sql
                      tags:
                        foo: baz
                      isSchema: false
                      isGeneralModel: false
                      raw:
                        sql: select * from accounts
                      syncs:
                      - 1
                      - 2
                      lastRunSize: 6789
                    hasMore: false
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '422':
          description: Validation Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
      description: List all the models in the current workspace including parent and related models
      summary: List Models
      security:
      - bearerAuth: []
      parameters:
      - description: filter based on name
        in: query
        name: name
        required: false
        schema:
          type: string
      - description: filter based on slug
        in: query
        name: slug
        required: false
        schema:
          type: string
      - description: set the offset on results (for pagination)
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: double
          type: number
      - description: limit the number of objects returned (default is 100)
        in: query
        name: limit
        required: false
        schema:
          default: 100
          format: double
          type: number
      - description: specify the order
        in: query
        name: orderBy
        required: false
        schema:
          default: id
          type: string
          enum:
          - id
          - name
          - slug
          - createdAt
          - updatedAt
      - description: 'filter models based on tags (format: key:value), ex: team:marketing. Repeat this parameter for multiple tags.'
        in: query
        name: tags
        required: false
        schema:
          default: []
          type: array
          items:
            type: string
      tags:
      - Models
    post:
      operationId: CreateModel
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Model'
                - $ref: '#/components/schemas/ValidateErrorJSON'
                - $ref: '#/components/schemas/InternalServerError'
              examples:
                Example 1:
                  value:
                    id: 3
                    name: testModel3
                    slug: testModel3
                    description: Users with their last names
                    workspaceId: 1
                    primaryKey: id
                    createdAt: '2022-02-16T21:37:58.510Z'
                    updatedAt: '2022-02-16T21:37:58.510Z'
                    createdBy:
                      id: 1
                      name: Jane Doe
                      email: jane.doe@example.com
                    updatedBy:
                      id: 1
                      name: Jane Doe
                      email: jane.doe@example.com
                    sourceId: 1
                    queryType: raw_sql
                    tags: {}
                    isSchema: false
                    isGeneralModel: false
                    raw:
                      sql: select id, last_name from users
                    syncs: []
                    lastRunSize: null
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '422':
          description: Validation Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: Create a new model
      summary: Create Model
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: skipColumnQuery
        required: false
        schema:
          default: false
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreate'
            examples:
              Example 1:
                value:
                  name: testModel3
                  slug: testModel3
                  description: Users with their last names
                  primaryKey: id
                  sourceId: 1
                  queryType: raw_sql
                  isSchema: false
                  raw:
                    sql: select id, last_name from users
              Example 2:
                value:
                  name: West coast fans
                  slug: west-coast-fans
                  description: Fans located in CA, OR, or WA
                  primaryKey: id
                  sourceId: 1
                  queryType: visual
                  isSchema: false
                  visual:
                    parentId: 2
                    filter:
                      conditions: []
                  spaceId: 3f2b1c8e-6d4a-4f0e-9b7c-2a1d5e8f0c3b
                  rowLevelAccessRuleIds:
                  - 7c0e7f1d-2a3b-4c5d-8e9f-0a1b2c3d4e5f
      tags:
      - Models
components:
  schemas:
    MatchBoosterTriggerOutput:
      description: The output of a trigger action to run a Match Booster enrichment.
      properties:
        id:
          type: string
          description: The id of the triggered enrichment job.
        status:
          type: string
          description: The status of the triggered enrichment job.
        createdAt:
          type: string
          description: Timestamp when the enrichment job was created.
      required:
      - id
      - status
      - createdAt
      type: object
      additionalProperties: false
    AudienceSizeStatus:
      type: string
      enum:
      - pending
      - success
      - failed
      - cancelled
    InternalServerError:
      type: string
      enum:
      - Internal Server Error
    Model:
      description: 'The SQL query that pulls data from your source to send to your destination.

        We send your SQL query directly to your source so any SQL that is valid for your source (including functions) is valid in Hightouch.'
      properties:
        id:
          type: number
          format: double
          description: The id of the model
        name:
          type: string
          description: The name of the model
        slug:
          type: string
          description: The slug of the model
        description:
          type:
          - string
          - 'null'
          description: The description of the model. Null when no description has been set.
        workspaceId:
          type: number
          format: double
          description: The id of the workspace where the model belongs to
        primaryKey:
          type: string
          description: The primary key will be null if the query doesn't get directly synced (e.g. a relationship table for visual querying)
        createdAt:
          type: string
          format: date-time
          description: The timestamp when model was created
        updatedAt:
          type: string
          format: date-time
          description: The timestamp when model was lastly updated
        createdBy:
          allOf:
          - $ref: '#/components/schemas/UserReference'
          description: The user who created the model, or null if no user was recorded
        updatedBy:
          allOf:
          - $ref: '#/components/schemas/UserReference'
          description: The user who last updated the model, or null if no user was recorded
        sourceId:
          type: number
          format: double
          description: The id of the source that model is connected to
        queryType:
          type: string
          description: 'The type of the query. Available options: custom, raw_sql, tabel, dbt and visual.'
        tags:
          properties: {}
          additionalProperties:
            type: string
          type: object
          description: The tags of the model
        isSchema:
          type: boolean
          description: 'If is_schema is true, the model is just used to build other models.

            Either as part of visual querying, or as the root of a visual query.'
        isGeneralModel:
          type: boolean
          description: 'If is_general_model is true, the model is not synced. It exposes warehouse

            data to Hightouch AI agents and is managed from the schema section.'
        syncs:
          items:
            type: number
            format: double
          type: array
          description: The list of id of syncs that uses this model
        visual:
          properties:
            secondaryLabel:
              type: string
            primaryLabel:
              type: string
            filter: {}
            parentId:
              type: number
              format: double
              description: Parent id of the schema that visual query is based on
          required:
          - filter
          - parentId
          type: object
          description: Visual query, used by audience
        custom:
          properties:
            query: {}
          required:
          - query
          type: object
          description: Custom query for sources that doesn't support sql. For example, Airtable.
        table:
          properties:
            name:
              type: string
          required:
          - name
          type: object
          description: Table-based query that fetches on a table instead of SQL
        dbt:
          properties:
            dbtUniqueId:
              type: string
              description: Unique ID of the model assigned by dbt (usually some combination of the schema and table name)
            compiledSql:
              type: string
              description: Compiled SQL in the dbt model
            rawSql:
              type: string
              description: Raw SQL in the dbt model
            database:
              type: string
              description: Name of the database containing the generated table
            schema:
              type: string
              description: Name of the schema containing the generated table
            name:
              type: string
              description: Name of the table generated by the dbt model
            modelId:
              type: number
              format: double
              description: Model id that refer to a dbt model
          required:
          - dbtUniqueId
          - compiledSql
          - rawSql
          - database
          - schema
          - name
          - modelId
          type: object
          description: Query that is based on a dbt model
        dbt_cloud:
          properties:
            dbtUniqueId:
              type: string
              description: Unique ID of the model assigned by dbt (usually some combination of the schema and table name)
            compiledSql:
              type: string
              description: Compiled SQL in the dbt model
            rawSql:
              type: string
            name:
              type: string
              description: Name of the table generated by the dbt model
            modelId:
              type: number
              format: double
              description: Model id that refer to a dbt model
          required:
          - dbtUniqueId
          - compiledSql
          - rawSql
          - name
          - modelId
          type: object
        raw:
          properties:
            sql:
              type: string
          required:
          - sql
          type: object
          description: Standard raw SQL query
        folderId:
          type: string
        lastRunSize:
          type:
          - number
          - 'null'
          format: double
          description: 'The number of rows returned by the most recent successful sync run of this model.

            Null if the model has never been synced successfully.'
        spaceId:
          type: string
          description: 'The Space this audience belongs to. Applies only to workspaces with Spaces enabled;

            contact Hightouch to enable Spaces and to obtain Space ids.

            Only valid when queryType is "visual". Omitted for models that are not in a Space.

            An API key scoped to a Space must set it on create. Read-only after creation.'
        rowLevelAccessRuleIds:
          items:
            type: string
          type: array
          description: 'Row-level access rules attached to this audience. Applies only to workspaces with

            Spaces enabled. Only valid when queryType is "visual"; always present on an audience.

            When creating an audience in a Space, include one rule from each required row-level

            access group on the parent model. Rule ids come from the Spaces governance API.

            Read-only after creation.'
      required:
      - id
      - name
      - slug
      - description
      - workspaceId
      - primaryKey
      - createdAt
      - updatedAt
      - createdBy
      - updatedBy
      - sourceId
      - queryType
      - tags
      - isSchema
      - isGeneralModel
      - syncs
      - lastRunSize
      type: object
      additionalProperties: false
    ListMatchBoosterRunsOutput:
      description: The output of a request to list Match Booster enrichment runs for a model.
      properties:
        data:
          items:
            $ref: '#/components/schemas/MatchBoosterRun'
          type: array
        hasMore:
          type: boolean
      required:
      - data
      - hasMore
      type: object
      additionalProperties: false
    MatchBoosterRun:
      description: A completed Match Booster enrichment run.
      properties:
        id:
          type: string
          description: The id of the enrichment run.
        status:
          type: string
        region:
          type: string
          description: The Match Booster region the enrichment ran in.
        error:
          type:
          - string
          - 'null'
          description: If available, the error associated with a failed run.
        enrichedRows:
          type:
          - number
          - 'null'
          format: double
